<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Colony Flow Sand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #6f86c8; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  #wrap canvas { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  #c3 { pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <canvas id="c3"></canvas>
  <canvas id="ui"></canvas>
</div>
<script type="module">
  import './three-layer.js';
  window.R3.init(document.getElementById('c3')).then(() => window.dispatchEvent(new Event('r3ready')))
    .catch(e => console.warn('3D layer unavailable, using 2D sprites', e));
</script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
